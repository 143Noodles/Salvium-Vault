// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    def isFdroidBuild = (project.findProperty("fdroidBuild") ?: System.getenv("FDROID_BUILD")) == "true"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        if (!isFdroidBuild) {
            classpath 'com.google.gms:google-services:4.4.4'
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // Java-only Android modules do not get Kotlin Gradle plugin alignment.
    // Keep the legacy jdk7/jdk8 artifacts aligned with the merged stdlib so
    // Cordova instrumentation does not package the same classes twice.
    ['com.android.application', 'com.android.library'].each { androidPlugin ->
        plugins.withId(androidPlugin) {
            dependencies.add('implementation', dependencies.platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
        }
    }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
